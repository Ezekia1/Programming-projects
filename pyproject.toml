[project]
name = "sapling"
version = "0.0.1"
description = "Personal study tool: ingest readings, extract structured knowledge, build a knowledge tree."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.71.0",
    "pydantic>=2.9",
    "pypdf>=5.1",
    "ebooklib>=0.18",
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12",
    "typer>=0.15",
    "rich>=13.9",
    "python-frontmatter>=1.1",
    "python-dotenv>=1.0",
]

[project.scripts]
sapling = "sapling.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sapling"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "fpdf2>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Typer's recommended pattern uses Argument/Option in defaults; ignore B008 there.
"src/sapling/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
